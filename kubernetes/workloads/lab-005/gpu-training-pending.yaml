apiVersion: v1
kind: Pod
metadata:
  name: gpu-training-pending
  namespace: default
  labels:
    app: gpu-training
    lab: gpu-scheduling
spec:
  restartPolicy: Never
  containers:
    - name: training
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Starting simulated GPU training workload"
          sleep 3600
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "500m"
          memory: "256Mi"
          nvidia.com/gpu: "1"
