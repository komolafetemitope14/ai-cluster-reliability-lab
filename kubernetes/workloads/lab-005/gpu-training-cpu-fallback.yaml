apiVersion: v1
kind: Pod
metadata:
  name: gpu-training-cpu-fallback
  namespace: default
  labels:
    app: gpu-training-cpu-fallback
    lab: gpu-scheduling
spec:
  restartPolicy: Never
  containers:
    - name: training
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Starting CPU-compatible simulated training workload"
          echo "GPU scheduling fallback demonstration"
          echo "No NVIDIA GPU is being used"
          sleep 3600
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
