apiVersion: v1
kind: Pod
metadata:
  name: gpu-training-pending
  namespace: default
  labels:
    app: gpu-training
    lab: scheduling-failure
spec:
  restartPolicy: Never
  containers:
    - name: training
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "Starting simulated AI training job"; sleep 3600
      resources:
        requests:
          cpu: "100"
          memory: "1Gi"
        limits:
          cpu: "100"
          memory: "1Gi"
