apiVersion: v1
kind: Pod
metadata:
  name: gpu-training-fixed
  namespace: default
  labels:
    app: gpu-training
    lab: scheduling-recovery
spec:
  restartPolicy: Never
  containers:
    - name: training
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "Starting simulated AI training job"; sleep 3600
      resources:
        requests:
          cpu: "500m"
          memory: "128Mi"
        limits:
          cpu: "1"
          memory: "256Mi"
