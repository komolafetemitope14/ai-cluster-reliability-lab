apiVersion: v1
kind: Pod
metadata:
  name: affinity-fixed
  namespace: default
  labels:
    app: affinity-demo
    lab: scheduling-constraints
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
  containers:
    - name: inference
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Starting simulated AI inference workload"
          echo "Node affinity requirement satisfied"
          echo "Running on an amd64 node"
          sleep 3600
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
