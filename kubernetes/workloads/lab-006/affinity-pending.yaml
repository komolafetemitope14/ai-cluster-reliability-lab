apiVersion: v1
kind: Pod
metadata:
  name: affinity-pending
  namespace: default
  labels:
    app: affinity-demo
    lab: scheduling-constraints
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: accelerator
                operator: In
                values:
                  - gpu
  containers:
    - name: inference
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Starting simulated AI inference workload"
          sleep 3600
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
