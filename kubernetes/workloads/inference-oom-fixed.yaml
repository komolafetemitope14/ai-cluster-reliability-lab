apiVersion: v1
kind: Pod
metadata:
  name: inference-oom-fixed
  namespace: default
  labels:
    app: inference-oom-fixed
    lab: memory-recovery
spec:
  restartPolicy: Always
  containers:
    - name: inference
      image: python:3.12-alpine
      command:
        - python
        - -u
        - -c
        - |
          import time

          print("Starting corrected AI inference memory test", flush=True)

          buffer = bytearray(16 * 1024 * 1024)

          print(
              f"Allocated a bounded buffer of {len(buffer) // (1024 * 1024)} MiB",
              flush=True
          )

          print("Simulated inference service running successfully", flush=True)

          while True:
              time.sleep(10)
      resources:
        requests:
          cpu: "100m"
          memory: "32Mi"
        limits:
          cpu: "500m"
          memory: "64Mi"
