apiVersion: v1
kind: Pod
metadata:
  name: readiness-failure
  namespace: default
  labels:
    app: probe-demo
    lab: health-probes
spec:
  restartPolicy: Always
  containers:
    - name: inference
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Starting simulated AI inference service"
          touch /tmp/service-started
          sleep 3600
      readinessProbe:
        exec:
          command:
            - cat
            - /tmp/model-ready
        initialDelaySeconds: 3
        periodSeconds: 5
        failureThreshold: 2
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
