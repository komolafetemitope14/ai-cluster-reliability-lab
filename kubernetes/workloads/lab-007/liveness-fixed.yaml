apiVersion: v1
kind: Pod
metadata:
  name: liveness-fixed
  namespace: default
  labels:
    app: probe-demo
    lab: health-probes
spec:
  restartPolicy: Always
  containers:
    - name: inference
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Starting simulated AI inference service"
          echo "Initializing application health state"
          echo "healthy" > /tmp/service-healthy
          echo "Application health check is ready"
          sleep 3600
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/service-healthy
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
